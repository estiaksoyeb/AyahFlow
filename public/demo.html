<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AyahFlow demo</title>
<style>
  @font-face{font-family:'Kalpurush';src:url('/fonts/kalpurush.ttf') format('truetype');font-display:swap}
  @font-face{font-family:'Amiri';src:url('/fonts/amiri.ttf') format('truetype');font-display:swap}
  :root{
    --primary:#044638;--on-primary:#FFFFFF;--primary-container:#D4EDDA;--on-primary-container:#07301E;
    --secondary:#C59B27;--background:#F9F7F2;--surface:#FFFFFF;--on-surface:#1B231D;
    --surface-variant:#EBE6DC;--on-surface-variant:#5A6358;--outline:#D5CEBF;
  }
  @media (prefers-color-scheme: dark){
    :root{--primary:#2ECC71;--on-primary:#052B19;--primary-container:#0D3B29;--on-primary-container:#A8F5C4;
      --secondary:#E5C158;--background:#121614;--surface:#1A201C;--on-surface:#EDEFEA;
      --surface-variant:#252E28;--on-surface-variant:#A8B2A8;--outline:#38443C;}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Kalpurush',system-ui,sans-serif;background:var(--background);color:var(--on-surface)}
  .pager{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;
    scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
  .pager::-webkit-scrollbar{display:none}
  .page{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
    display:flex;flex-direction:column;padding:44px 16px 22px}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex:none}
  .surah-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;
    background:color-mix(in srgb,var(--surface-variant) 60%,transparent);border:0;color:inherit;
    font-family:inherit;text-align:left;cursor:pointer}
  .surah-pill svg{color:var(--primary);flex:none}
  .surah-name{font-weight:700;font-size:15px;line-height:1.1}
  .surah-sub{font-size:11px;color:var(--on-surface-variant)}
  .top-actions{display:flex;align-items:center}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;
    display:grid;place-items:center;color:var(--on-surface-variant);position:relative}
  .ring-wrap{width:48px;height:48px;display:grid;place-items:center;position:relative}
  .ring-wrap svg{position:absolute;inset:0;margin:auto;transform:rotate(-90deg)}
  .daily{flex:none;margin-top:8px}
  .daily-row{display:flex;justify-content:space-between;font-size:12px;color:var(--on-surface-variant)}
  .daily-row .done{color:var(--primary);font-weight:600}
  .daily-bar{margin-top:6px;height:4px;border-radius:2px;background:var(--surface-variant);overflow:hidden}
  .daily-bar > i{display:block;height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
  .card{flex:1;margin-top:10px;background:var(--surface);border-radius:24px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
  .card-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16px 20px;overflow:hidden}
  .bismillah{font-family:'Amiri',serif;font-size:22px;color:var(--primary);margin-bottom:12px;direction:rtl}
  .ref-badge{display:inline-block;padding:5px 14px;border-radius:12px;
    background:color-mix(in srgb,var(--primary) 8%,transparent);
    border:1px solid color-mix(in srgb,var(--primary) 20%,transparent);
    color:var(--primary);font-size:13px;font-weight:600}
  .arabic{font-family:'Amiri',serif;font-size:22px;line-height:36px;color:var(--primary);
    direction:rtl;margin-top:14px;width:100%}
  .bengali{margin-top:12px;width:100%;font-weight:400;line-height:1.65}
  .english{margin-top:10px;width:100%;font-size:13.5px;line-height:20px;font-style:italic;
    color:color-mix(in srgb,var(--on-surface-variant) 85%,transparent)}
  .bottombar{flex:none;margin-top:10px;display:flex;align-items:center;justify-content:space-between;padding:2px 6px}
  .left-actions{display:flex;gap:8px}
  .round-btn{width:40px;height:40px;border-radius:50%;border:0;
    background:color-mix(in srgb,var(--surface-variant) 40%,transparent);
    color:var(--on-surface-variant);display:grid;place-items:center}
  .bm-btn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;
    background:color-mix(in srgb,var(--surface-variant) 40%,transparent);color:var(--on-surface-variant)}
</style>
</head>
<body>
<div class="pager" id="pager"></div>
<script>
const SVG={
 list:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
 history:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>',
 bookmark:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
 settings:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>',
 share:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
 copy:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
 search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
};
const BN=n=>String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[+d]);

function render(a,idx){
  const el=document.createElement('section');el.className='page';
  el.innerHTML=`
    <div class="topbar">
      <button class="surah-pill">${SVG.list}
        <div><div class="surah-name">${a.surahBn}</div>
        <div class="surah-sub">${a.surahEn} • ${BN(a.num)}/${BN(a.total)}</div></div>
      </button>
      <div class="top-actions">
        <div class="ring-wrap">
          <svg width="32" height="32" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="14" fill="none" stroke="color-mix(in srgb,var(--surface-variant) 45%,transparent)" stroke-width="1.5"/>
          </svg>
          <button class="icon-btn">${SVG.history}</button>
        </div>
        <button class="icon-btn">${SVG.bookmark}</button>
        <button class="icon-btn">${SVG.settings}</button>
      </div>
    </div>
    <div class="daily">
      <div class="daily-row">
        <span class="${idx===0?'done':''}">${idx===0?'আজকের লক্ষ্য পূর্ণ ✓':'আজ '+BN(idx+3)+'/১০ আয়াত'}</span>
        <span>খতমে বাকি ~${BN(300-idx*12)} দিন</span>
      </div>
      <div class="daily-bar"><i style="width:${Math.min(100,(idx+3)*10)}%"></i></div>
    </div>
    <div class="card"><div class="card-inner">
      ${a.num===1?'<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':''}
      <span class="ref-badge">আয়াত ${BN(a.surahId)}:${BN(a.num)} (${a.surahId}:${a.num})</span>
      <div class="arabic">${a.ar}</div>
      <div class="bengali" style="font-size:19px;line-height:1.6">${a.bn}</div>
      <div class="english">${a.en}</div>
    </div></div>
    <div class="bottombar">
      <div class="left-actions">
        <button class="round-btn">${SVG.share}</button>
        <button class="round-btn">${SVG.copy}</button>
        <button class="round-btn">${SVG.search}</button>
      </div>
      <button class="bm-btn">${SVG.bookmark}</button>
    </div>`;
  return el;
}

(async () => {
  const pager=document.getElementById('pager');
  const AYAHS=await (await fetch('/demo-data.json')).json();
  for(let pass=0;pass<2;pass++) AYAHS.forEach((a,i)=>pager.appendChild(render(a,i)));

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pageH=()=>pager.clientHeight||656;
  const step=()=>{
    const atEnd=pager.scrollTop+pageH()>=pager.scrollHeight-4;
    if(atEnd) pager.scrollTo({top:0,behavior:'auto'});
    else pager.scrollBy({top:pageH(),behavior:reduce?'auto':'smooth'});
  };
  let timer=null;
  const start=()=>{ if(reduce) return; clearInterval(timer); timer=setInterval(step,4000); };
  const stop =()=>{ clearInterval(timer); timer=null; };

  // pause while user is interacting
  pager.addEventListener('scroll',()=>{ stop(); clearTimeout(pager._r); pager._r=setTimeout(start,3500); },{passive:true});

  // pause when offscreen; also used by parent page via postMessage
  const io=new IntersectionObserver(es=>{
    es.forEach(e=> e.isIntersecting ? start() : stop());
  },{threshold:0.25});
  io.observe(pager);

  window.addEventListener('message',e=>{
    if(e.data==='ayahflow:pause') stop();
    if(e.data==='ayahflow:play')  start();
  });

  start();
})();
</script>
</body>
</html>
